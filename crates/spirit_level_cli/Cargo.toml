[package]
name = "spirit_level_cli"
description = "The spl command: check a project, explain a lint, list lints and tiers, show the resolved configuration, write the book pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "spl"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
sl_book.workspace = true
sl_config.workspace = true
sl_core.workspace = true
sl_dependents.workspace = true
sl_engine.workspace = true
sl_model.workspace = true
sl_report.workspace = true
sl_tools.workspace = true
spirit_level.workspace = true
vc_build.workspace = true
vc_complete.workspace = true
vc_ui.workspace = true

[build-dependencies]
vc_build.workspace = true

[dev-dependencies]
serde_json.workspace = true
sl_firmware = { workspace = true, features = ["synth"] }

[features]
# the hakari lints run (links hakari)
hakari = ["spirit_level/hakari"]
# geiger-unsafe-deps runs (links geiger)
geiger = ["spirit_level/geiger"]

[lints]
workspace = true
