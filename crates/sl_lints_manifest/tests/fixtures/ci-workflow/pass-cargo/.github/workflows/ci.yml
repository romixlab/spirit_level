name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # no justfile here: cargo runs the checks
      - run: >
          cargo +stable clippy --all-targets -- -D warnings
      - run: |
          cargo build && \
            RUST_BACKTRACE=1 cargo nextest run --workspace
