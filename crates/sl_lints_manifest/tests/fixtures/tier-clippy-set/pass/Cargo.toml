[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "forbid"
todo = "deny"
cast_lossless = "allow" # widening casts lose nothing
# names like encoder/encoded are fine here
similar_names = "allow"
