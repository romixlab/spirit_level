[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://example.org/fx"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1", git = "https://example.org/serde", branch = "main", default-features = false }
itoa = { version = "1", git = "https://example.org/itoa", branch = "main" }
