# The lint codes: every code ever given, with the lint id it belongs to. A code is never reused or changed; a
# retired lint keeps its row with status = "retired", so its code stays reserved. `spl codes --check` (in
# `just lint`) holds the lints and this file to each other, and to main's copy.
#
# Groups: M manifest, S size, T state, G graph, C code, P prose, A ai, F firmware, X external tool adapters.
# A new lint takes the next free number of its group.

