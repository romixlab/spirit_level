[package]
name = "sl_tool_geiger"
description = "spirit_level adapter of geiger, linked: dependencies that use unsafe code, counted in their sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
geiger = { workspace = true, optional = true }
sl_analysis.workspace = true
sl_core.workspace = true
sl_tools.workspace = true

[features]
# links geiger, so the lint runs (without it it reports that it did not run)
link = ["dep:geiger"]

[dev-dependencies]
# the fixtures run the linked analysis
sl_tool_geiger = { workspace = true, features = ["link"] }
sl_testkit.workspace = true

[lints]
workspace = true
