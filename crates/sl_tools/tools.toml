# The external tools spirit_level's adapters run, at the versions their output parsers are tested against.
# `spl tools install [TOOL]` installs these into the tool cache; a tool found on PATH instead may be another
# version. Keys:
#   crate, version     a crates.io crate built with `cargo install --locked --version`
#   features           cargo features to build it with; default-features = false drops the crate's defaults
#   component          a rustup component instead (`rustup component add`), versioned with the toolchain
#   exe                the executable the adapters start
#   nightly            the tool runs on a nightly toolchain

[clippy]
component = "clippy"
exe = "cargo-clippy"

[rustfmt]
component = "rustfmt"
exe = "cargo-fmt"

[cargo-deny]
crate = "cargo-deny"
version = "0.20.2"
exe = "cargo-deny"

[cargo-machete]
crate = "cargo-machete"
version = "0.9.2"
exe = "cargo-machete"

[cargo-shear]
crate = "cargo-shear"
version = "1.14.1"
exe = "cargo-shear"

[typos]
crate = "typos-cli"
version = "1.52.2"
exe = "typos"

[taplo]
crate = "taplo-cli"
version = "0.10.0"
default-features = false
exe = "taplo"

[cargo-semver-checks]
crate = "cargo-semver-checks"
version = "0.51.0"
exe = "cargo-semver-checks"

[cargo-udeps]
crate = "cargo-udeps"
version = "0.1.61"
exe = "cargo-udeps"
nightly = true

[cargo-audit]
crate = "cargo-audit"
version = "0.23.0"
default-features = false
exe = "cargo-audit"
