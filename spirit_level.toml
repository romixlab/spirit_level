# spirit_level checks itself at the big tier.
extends = "big"

[[exceptions]]
lint = "panic-in-library"
crates = ["sl_testkit"]
level = "allow"
reason = "a test harness reports a failed fixture by panicking, as assert! does"

[map.layers.core]
desc = "Types only: lint metadata, levels, parameters, diagnostics"
allow = []

[map.layers.model]
desc = "Reading the project and the configuration"
allow = ["core", "model"]

[map.layers.analysis]
desc = "The analysis trait and helpers every lint crate uses"
allow = ["core", "model"]

[map.layers.lints]
desc = "One crate per analysis family; lint crates never see each other"
allow = ["core", "model", "analysis"]

[map.layers.engine]
desc = "Running analyses, waivers, fixes, reports"
allow = ["core", "model", "analysis", "engine"]

[map.layers.app]
desc = "The registry, the book generator and the binary"
allow = ["core", "model", "analysis", "lints", "engine", "app"]

[map.layers.tests]
desc = "Test-only crates; only dev-dependencies point here"
allow = ["core", "model", "analysis", "engine", "tests"]

[map.crates]
sl_core = { layer = "core" }
sl_model = { layer = "model" }
sl_config = { layer = "model" }
sl_tools = { layer = "model" }
sl_analysis = { layer = "analysis" }
sl_lints_ai = { layer = "lints" }
sl_lints_code = { layer = "lints" }
sl_lints_graph = { layer = "lints" }
sl_lints_manifest = { layer = "lints" }
sl_lints_prose = { layer = "lints" }
sl_lints_size = { layer = "lints" }
sl_lints_state = { layer = "lints" }
sl_lints_modules = { layer = "lints" }
sl_lints_dead = { layer = "lints" }
sl_lints_errors = { layer = "lints" }
sl_lints_surface = { layer = "lints" }
sl_tool_clippy = { layer = "lints" }
sl_tool_deny = { layer = "lints" }
sl_tool_machete = { layer = "lints" }
sl_tool_rustfmt = { layer = "lints" }
sl_tool_typos = { layer = "lints" }
sl_tool_taplo = { layer = "lints" }
sl_tool_geiger = { layer = "lints" }
sl_tool_hakari = { layer = "lints" }
sl_tool_cargo = { layer = "lints" }
sl_tool_udeps = { layer = "lints" }
sl_tool_audit = { layer = "lints" }
sl_tool_shear = { layer = "lints" }
sl_tool_semver = { layer = "lints" }
sl_engine = { layer = "engine" }
sl_report = { layer = "engine" }
spirit_level = { layer = "app" }
sl_book = { layer = "app" }
spirit_level_cli = { layer = "app" }
sl_testkit = { layer = "tests" }

[map.forbid]
# the library a project links to check itself never pulls the CLI's dependencies
spirit_level = ["clap", "anstream"]
