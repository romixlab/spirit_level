name: Book

# The book (docs/, zensical.toml): built strict on every change, so a broken page or link fails CI. On main the
# deploy job publishes it to GitHub Pages with actions/deploy-pages (Pages source "GitHub Actions"; the domain
# spl.vhrd.tech is a repository setting, no CNAME file). Every run on main shares one group that is never
# cancelled, so a deploy is never interrupted and two never run at once.

on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the built book to GitHub Pages"
        type: boolean
        default: false

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && 'main' || (github.head_ref || github.run_id) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: build the book (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # the generated pages, the logo files, then the site: a warning fails
      - run: just docs-build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
          retention-days: 7

  # Every push to main, and by hand on main with "deploy" ticked. Pull requests and the merge queue only build.
  deploy:
    name: publish to GitHub Pages
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
