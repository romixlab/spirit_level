# The book's site (docs/, zensical.toml). Not a Python package of the crate: `uv run zensical ...` through
# `just docs` and `just docs-build`.
[project]
name = "spirit-level-book"
version = "0.7.5"
requires-python = ">=3.12"
# the book kit vhrd-zensical: the `console` and `rust` fences' lexers, the code colours and the `vz` command that
# writes the footer stamp; its `zensical` extra pins the Zensical release the kit is tested against
dependencies = ["vhrd-zensical[zensical]==0.2.0"]
