[workspace]
resolver = "3"
members = ["crates/*"]


[workspace.package]
version = "0.7.2"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/romixlab/spirit_level"
homepage = "https://spl.vhrd.tech/"

[workspace.dependencies]
# crates/core and model:
annotate-snippets = { version = "0.12", default-features = false, features = ["std"] }
anstyle = { version = "1", default-features = false, features = ["std"] }
cargo_metadata = { version = "0.23", default-features = false }
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "color",
  "suggestions",
  "env",
] }
clap_complete = { version = "4", default-features = false, features = ["unstable-dynamic"] }
# the generic CLI parts (vhrd_cli), on its default branch (main); Cargo.lock fixes the version
vc_build = { git = "https://github.com/vhrdtech/vhrd_cli", default-features = false }
vc_complete = { git = "https://github.com/vhrdtech/vhrd_cli", default-features = false }
vc_ui = { git = "https://github.com/vhrdtech/vhrd_cli", default-features = false }
vc_usage = { git = "https://github.com/vhrdtech/vhrd_cli", default-features = false }
# spl's progress display on stderr (console, portable-atomic, unit-prefix; no C)
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
# spl's tests: a pseudo-terminal to see the progress display as a person does
rustix = { version = "1", default-features = false, features = ["std", "pty", "termios"] }
# spl's commands register themselves (pure Rust, no proc macro)
inventory = { version = "0.3", default-features = false }
# linked tool libraries (always built into spirit_level):
geiger = { version = "0.5", default-features = false }
guppy = { version = "0.19", default-features = false }
hakari = { version = "0.18", default-features = false, features = ["cli-support"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
semver = { version = "1", default-features = false }
syn = { version = "3", default-features = false, features = [
  "full",
  "visit",
  "parsing",
  "printing",
  "clone-impls",
  "extra-traits",
] }
html5gum = { version = "0.9", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
# sl_board_model (the board description, read with spans):
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# sl_model (a book configured by mkdocs.yml, read with spans):
yaml-rust2 = { version = "0.13", default-features = false }
# sl_firmware (the linked ELF; synthetic fixture ELFs with `write`; its DWARF for the panic sites):
addr2line = { version = "0.27", default-features = false, features = ["std"] }
object = { version = "0.38", default-features = false, features = ["read_core", "elf", "std"] }
quote = { version = "1", default-features = false }
rustc-demangle = { version = "0.1", default-features = false }

# workspace crates:
sl_analysis = { path = "crates/sl_analysis" }
sl_board = { path = "crates/sl_board" }
sl_board_model = { path = "crates/sl_board_model" }
sl_book = { path = "crates/sl_book" }
sl_config = { path = "crates/sl_config" }
sl_dependents = { path = "crates/sl_dependents" }
sl_docs = { path = "crates/sl_docs" }
sl_core = { path = "crates/sl_core" }
sl_engine = { path = "crates/sl_engine" }
sl_firmware = { path = "crates/sl_firmware" }
sl_lints_ai = { path = "crates/sl_lints_ai" }
sl_lints_units = { path = "crates/sl_lints_units" }
sl_lints_board = { path = "crates/sl_lints_board" }
sl_lints_cli = { path = "crates/sl_lints_cli" }
sl_lints_code = { path = "crates/sl_lints_code" }
sl_lints_dead = { path = "crates/sl_lints_dead" }
sl_lints_docs = { path = "crates/sl_lints_docs" }
sl_lints_embedded = { path = "crates/sl_lints_embedded" }
sl_lints_errors = { path = "crates/sl_lints_errors" }
sl_lints_graph = { path = "crates/sl_lints_graph" }
sl_lints_manifest = { path = "crates/sl_lints_manifest" }
sl_lints_prose = { path = "crates/sl_lints_prose" }
sl_lints_ui = { path = "crates/sl_lints_ui" }
sl_lints_modules = { path = "crates/sl_lints_modules" }
sl_lints_size = { path = "crates/sl_lints_size" }
sl_lints_state = { path = "crates/sl_lints_state" }
sl_lints_surface = { path = "crates/sl_lints_surface" }
sl_model = { path = "crates/sl_model" }
sl_report = { path = "crates/sl_report" }
sl_testkit = { path = "crates/sl_testkit" }
sl_tool_clippy = { path = "crates/sl_tool_clippy" }
sl_tool_deny = { path = "crates/sl_tool_deny" }
sl_tool_machete = { path = "crates/sl_tool_machete" }
sl_tool_typos = { path = "crates/sl_tool_typos" }
sl_tool_rustfmt = { path = "crates/sl_tool_rustfmt" }
sl_tool_semver = { path = "crates/sl_tool_semver" }
sl_tool_shear = { path = "crates/sl_tool_shear" }
sl_tool_audit = { path = "crates/sl_tool_audit" }
sl_tool_udeps = { path = "crates/sl_tool_udeps" }
sl_tool_cargo = { path = "crates/sl_tool_cargo" }
sl_tool_hakari = { path = "crates/sl_tool_hakari" }
sl_tool_geiger = { path = "crates/sl_tool_geiger" }
sl_tool_taplo = { path = "crates/sl_tool_taplo" }
sl_tools = { path = "crates/sl_tools" }
spirit_level = { path = "crates/spirit_level" }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "warn"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
cargo = { level = "warn", priority = -1 }    # manifest hygiene: feature names, wildcard versions
pedantic = { level = "warn", priority = -1 } # the stricter idioms; the opt-outs below are the ones that are noise for most code
allow_attributes = "warn"                    # #[expect] fails once the lint stops firing, so an exception cannot outlive its cause
as_ptr_cast_mut = "warn"                     # `as_ptr() as *mut` writes through a shared borrow: undefined behaviour
missing_panics_doc = "warn"                  # a public function that can panic says when in a # Panics section
ignore_without_reason = "warn"               # an ignored test says why, or nobody knows when it may run again
cognitive_complexity = "warn"                # a function too tangled to follow in one read; complements spl's cyclomatic function-complexity
exit = "warn"                                # process::exit skips every destructor; main returns instead
fallible_impl_from = "warn"                  # a From that can panic is a TryFrom
float_cmp_const = "warn"                     # comparing a float to a constant exactly is almost always a bug
debug_assert_with_mut_call = "warn"          # debug and release builds differ when a debug_assert! calls a &mut method
get_unwrap = "warn"                          # `.get(i).unwrap()` is indexing with a worse message: index, or handle the None
imprecise_flops = "warn"                     # hypot, ln_1p and friends are more precise than the formula written out
iter_over_hash_type = "warn"                 # iteration over a hash map changes order from run to run; random-state-hash reports the type
let_underscore_must_use = "warn"             # `let _ =` on a must_use value drops an error unseen
lossy_float_literal = "warn"                 # a float literal that does not fit its type silently becomes another number
map_err_ignore = "warn"                      # `map_err(|_| ...)` throws the cause away; wrap it as the source
mem_forget = "warn"                          # forget leaks the value and skips Drop; ManuallyDrop says it on purpose
print_stderr = "warn"                        # printing is the binary's choice, written in one place
print_stdout = "warn"                        # printing is the binary's choice, written in one place
self_named_module_files = "warn"             # one module layout, mod.rs, across the workspace
str_to_string = "warn"                       # to_owned says what happens: a copy of a borrowed str
too_long_first_doc_paragraph = "warn"        # the first doc paragraph is the summary rustdoc lists; one short sentence
undocumented_unsafe_blocks = "warn"          # every unsafe block says in a SAFETY: comment why it is sound
unnecessary_safety_doc = "warn"              # a # Safety section on a safe function sends readers looking for a contract that is not there
unwrap_used = "warn"                         # a panic says what failed (expect with a message), or the error is returned
use_self = "warn"                            # Self follows a rename
assigning_clones = "allow"                   # clone_into reads backwards
cargo_common_metadata = "allow"              # keywords and categories matter only for published crates; package-description covers the rest
cast_lossless = "allow"                      # a widening `as` cast loses nothing, and From is longer for no gain
cast_possible_truncation = "allow"           # too noisy: most casts are of values known to fit
cast_precision_loss = "allow"                # too noisy: integer to float for display and statistics is the common case
cast_sign_loss = "allow"                     # too noisy: most casts are of values known to be non-negative
default_trait_access = "allow"               # Default::default() is clear where the type is written beside it
float_cmp = "allow"                          # exact float comparisons are usually intended; float_cmp_const stays on in big
implicit_hasher = "allow"                    # a BuildHasher type parameter on public functions is not worth it
inline_always = "allow"                      # #[inline(always)] is written where it was measured
items_after_statements = "allow"             # a helper item next to its only use reads better
many_single_char_names = "allow"             # r, g, b and x, y, z are fine
map_unwrap_or = "allow"                      # `.map(f).unwrap_or(x)` often reads better than map_or
missing_errors_doc = "allow"                 # the error type documents its cases
too_many_lines = "allow"                     # spl's function-lines measures function length, with a limit per crate and expiring exceptions
multiple_crate_versions = "allow"            # spl's duplicate-versions checks this, with a reasoned allow list
must_use_candidate = "allow"                 # thousands of hits; must_use goes where ignoring the value is a bug
needless_raw_string_hashes = "allow"         # r#"..."# keeps a string editable when a quote is added
redundant_closure_for_method_calls = "allow" # a closure is often clearer than a path to a method
return_self_not_must_use = "allow"           # thousands of hits on builders
similar_names = "allow"                      # too many false positives: encoder and encoded are different things
struct_excessive_bools = "allow"             # a struct of flags is often just that
struct_field_names = "allow"                 # a field named after its struct is often the clearest name
trivially_copy_pass_by_ref = "allow"         # passing small Copy types by reference is harmless
unnecessary_debug_formatting = "allow"       # paths printed with {:?} quote themselves, which helps with spaces
unreadable_literal = "allow"                 # addresses and magic numbers are written as their sources write them
used_underscore_binding = "allow"            # an underscore binding used in one cfg is common

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"
broken_intra_doc_links = "deny"

[profile.dev]
debug = false
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.deploy]
inherits = "release"
incremental = true
