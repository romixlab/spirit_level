# spirit-level:book-nav-end

# The look: the logo (assets/logo, copied into docs/assets/logo by `just docs-assets`), its lime as the accent
# (docs/stylesheets/brand.css), apple-touch and ICO links in docs-overrides/main.html
extra_css = ["stylesheets/brand.css"]

[project.theme]
custom_dir = "docs-overrides"
favicon = "assets/logo/icon-small.svg"
logo = "assets/logo/mark-light.svg"
language = "en"
features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.indexes",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "custom"
accent = "custom"
