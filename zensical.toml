        "lints/core-crate-deps.md",
        "lints/core-crate-types.md",
        "lints/crate-cycles.md",
        "lints/crate-dir-name.md",
        "lints/crate-docs.md",
        "lints/crate-lines.md",
        "lints/crate-table.md",
        "lints/dead-features.md",
        "lints/dead-pub.md",
        "lints/default-features-off.md",
        "lints/duplicate-versions.md",
        "lints/edition-latest.md",
        "lints/emoji.md",
        "lints/error-enum-growth.md",
        "lints/external-form.md",
        "lints/feature-docs.md",
        "lints/filler-phrases.md",
        "lints/float-determinism.md",
        "lints/forbidden-closure.md",
        "lints/function-complexity.md",
