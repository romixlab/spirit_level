        "lints/justfile-recipes.md",
        "lints/justfile-simple.md",
        "lints/layer-edges.md",
        "lints/leftover-files.md",
        "lints/lint-table-allow-reason.md",
        "lints/lock-held-across.md",
        "lints/lock-unwrap.md",
        "lints/macro-crate-suffix.md",
        "lints/map-complete.md",
        "lints/module-graph-scc.md",
        "lints/module-lines.md",
