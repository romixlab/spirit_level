# The spirit_level book: `just docs` serves it, `just docs-build` builds it strict into site/.
# The lint and tier pages and the nav below are generated by `spirit-level book` (`just book`) from the lints'
# own metadata; `just lint` fails when they are stale.
[project]
site_name = "spirit_level"
site_description = "A linter for Rust projects of every size: tiers of lints in TOML, from one crate to a workspace of hundreds"
site_author = "Roman Isaikin"
copyright = "Copyright &copy; 2026 Roman Isaikin, MIT or Apache-2.0"
repo_url = "https://github.com/romixlab/spirit_level"
repo_name = "romixlab/spirit_level"
edit_uri = "edit/main/docs/"

# spirit-level:book-nav (generated by `spirit-level book`, do not edit by hand)
nav = [
    { "Introduction" = "index.md" },
    { "Getting started" = "start.md" },
    { "Configuration" = "configuration.md" },
    { "The crate map" = "map.md" },
    { "Waivers" = "waivers.md" },
    { "Output and exit codes" = "output.md" },
    { "External tools" = "tools.md" },
    { "Writing a lint" = "writing-lints.md" },
    { "Tiers" = [
        "tiers/index.md",
        "tiers/small.md",
        "tiers/small-workspace.md",
        "tiers/medium.md",
        "tiers/big.md",
        "tiers/ai.md",
    ] },
    { "Lints" = [
        "lints/index.md",
        "lints/agent-config-permissions.md",
        "lints/agent-config-secrets.md",
        "lints/agent-file-lines.md",
        "lints/agent-file-links.md",
        "lints/agent-rules-match-lints.md",
        "lints/agent-session-files.md",
        "lints/allow-without-reason.md",
