# The spirit_level book: `just docs` serves it, `just docs-build` builds it strict into site/.
# The lint and tier pages and the nav below are generated by `spl book` (`just book`) from the lints'
# own metadata; `just lint` fails when they are stale.
[project]
site_name = "spirit_level"
site_description = "A linter for Rust projects of every size: tiers of lints in TOML, from one crate to a workspace of hundreds"
site_author = "Roman Isaikin"
copyright = "Copyright &copy; 2026 Roman Isaikin, MIT or Apache-2.0"
repo_url = "https://github.com/romixlab/spirit_level"
repo_name = "romixlab/spirit_level"
edit_uri = "edit/main/docs/"

