# cargo-deny, run by spirit_level's deny-* lints at the big tier

[graph]
all-features = true

[licenses]
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "MIT", "Unicode-3.0", "Unlicense", "Zlib"]

[bans]
multiple-versions = "deny"
# duplicates that only the linked adapters (hakari, geiger) bring in
skip-tree = [
  { crate = "hakari", reason = "hakari is always linked in; its graph libraries pin older versions" },
  { crate = "geiger", reason = "geiger is always linked in; it parses with syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# the generic CLI parts (vc_ui, vc_build, vc_complete, vc_usage)
allow-git = ["https://github.com/vhrdtech/vhrd_cli"]
